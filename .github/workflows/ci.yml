name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: echo "" > .npmrc
      - run: pnpm install --frozen-lockfile 2>&1 | tee install.log
      - run: pnpm typecheck 2>&1 | tee typecheck.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: typecheck-logs
          path: |
            install.log
            typecheck.log

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: echo "" > .npmrc
      - run: pnpm install --frozen-lockfile 2>&1 | tee install.log
      - run: pnpm lint 2>&1 | tee lint.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-logs
          path: |
            install.log
            lint.log

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: echo "" > .npmrc
      - run: pnpm install --frozen-lockfile 2>&1 | tee install.log
      - run: pnpm test 2>&1 | tee test.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-logs
          path: |
            install.log
            test.log
